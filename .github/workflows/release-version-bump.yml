name: Release Version Bump and Tag

on:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: write

jobs:
  bump-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump metadata version
        id: bump
        run: |
          NEW_VERSION="$(./scripts/bump_metadata_version.sh metadata.hcl patch)"
          echo "new_version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.hcl
          git commit -m "chore(release): bump metadata version to v${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Check for existing tag
        id: tag_check
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git ls-remote --exit-code --tags origin "${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          generate_release_notes: true
