name: Nomad ACL Policy Validation

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'policies/**'
      - 'scripts/apply-acl-policies.sh'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'policies/**'
      - 'scripts/apply-acl-policies.sh'

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@ceba9087d4322dbdd7b35dafac5a87a8c459a157  # v1.0.0

      - name: Validate ACL Policy Syntax
        run: |
          echo "Checking HCL formatting for policy files..."
          # NOTE: policies/*.hcl intentionally reference namespace "default" to match the
          # pack's nomad_namespace default. Operators deploying to a custom namespace can
          # substitute before applying (see docs/infrastructure/acl-policies.md § "Namespace Configuration"
          # and scripts/apply-acl-policies.sh).
          # CI validates HCL syntax only — it does not apply policies to any cluster.
          nomad fmt -check policies/

      - name: Validate apply-acl-policies.sh syntax
        run: bash -n scripts/apply-acl-policies.sh

      - name: List Policy Files
        run: ls -1 policies/*.hcl
