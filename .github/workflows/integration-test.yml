name: Integration Test

on:
  pull_request:
    branches: [ develop ]
    # Path coverage policy: run integration validation whenever any pack-impacting
    # path changes. This includes:
    #   - templates/**         : Nomad job template files
    #   - variables.hcl        : all user-facing variable definitions
    #   - packs/**             : registry-aligned pack mirror (must stay in sync with root)
    #   - scripts/**           : validation helpers used by CI and operators
    #   - examples/**          : var-files used by render/plan/e2e (covers e2e-test.hcl)
    #   - metadata.hcl         : pack version and app_version metadata
    #   - workflow file itself  : changes to this CI definition
    paths:
      - 'templates/**'
      - 'variables.hcl'
      - 'packs/**'
      - 'scripts/**'
      - 'examples/**'
      - 'metadata.hcl'
      - '.github/workflows/integration-test.yml'

env:
  NOMAD_VERSION: "1.7.7"
  CONSUL_VERSION: "1.17.1"
  E2E_VAR_FILE: "examples/e2e-test.hcl"

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@ceba9087d4322dbdd7b35dafac5a87a8c459a157  # v1.0.0
        with:
          version: ${{ env.NOMAD_VERSION }}

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@36154659711632399739eb3b34d2e71dd54ed473  # 0.10.0

      - name: Render and validate templates
        run: |
          nomad-pack render . --var-file examples/minimal-dev.hcl
          echo "Template rendering succeeded"

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@ceba9087d4322dbdd7b35dafac5a87a8c459a157  # v1.0.0
        with:
          version: ${{ env.NOMAD_VERSION }}

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@36154659711632399739eb3b34d2e71dd54ed473  # 0.10.0

      - name: Install Consul
        run: |
          curl -fsSL "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip" -o "consul_${CONSUL_VERSION}_linux_amd64.zip"
          curl -fsSL "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_SHA256SUMS" -o consul_SHA256SUMS
          sha256sum --check --ignore-missing consul_SHA256SUMS || { echo "Checksum verification failed"; exit 1; }
          unzip -q "consul_${CONSUL_VERSION}_linux_amd64.zip"
          sudo mv consul /usr/local/bin/consul
          consul version

      - name: Ensure Docker is available
        run: |
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl start docker || true
          fi
          docker info >/dev/null

      - name: Start Consul and Nomad dev agents
        run: |
          # Determine initial Docker bridge IP.
          DOCKER_BRIDGE_IP=$(docker network inspect bridge \
            --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || echo "172.17.0.1")
          echo "Docker bridge IP (pre-restart): ${DOCKER_BRIDGE_IP}"

          # Install dnsmasq before Docker restart so the package is ready.
          sudo apt-get install -q -y dnsmasq
          sudo systemctl stop dnsmasq 2>/dev/null || true

          # Reconfigure Docker daemon DNS BEFORE restarting so docker0 comes up
          # with the correct resolver config from the start.  Docker must restart
          # BEFORE dnsmasq binds to docker0 so the interface is stable when dnsmasq
          # starts (docker0 briefly disappears during daemon restart).
          echo "{\"dns\": [\"${DOCKER_BRIDGE_IP}\", \"8.8.8.8\"]}" | \
            sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
          # Re-detect bridge IP after restart (should still be 172.17.0.1).
          DOCKER_BRIDGE_IP=$(docker network inspect bridge \
            --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || echo "172.17.0.1")
          docker info > /dev/null
          echo "Docker bridge IP (post-restart): ${DOCKER_BRIDGE_IP}"

          # Start dnsmasq AFTER docker0 is stable so --bind-interfaces can attach.
          # Forwards .consul queries to Consul DNS (port 8600); all other queries to 8.8.8.8.
          sudo dnsmasq \
            --listen-address="${DOCKER_BRIDGE_IP}" \
            --bind-interfaces \
            --port=53 \
            --server="/consul/127.0.0.1#8600" \
            --server=8.8.8.8 &
          sleep 1
          echo "dnsmasq started on ${DOCKER_BRIDGE_IP}:53"

          # Start Consul dev agent (required for service registration and wait-for-deps prestart tasks).
          # -bind=127.0.0.1    : Consul cluster/RPC traffic stays on loopback.
          # -client=0.0.0.0    : HTTP API and DNS are reachable on all interfaces
          #                      (including the Docker bridge at ${DOCKER_BRIDGE_IP}).
          # -advertise=${DOCKER_BRIDGE_IP}: Consul advertises the Docker bridge IP so that
          #                      "consul.service.consul" DNS lookups return ${DOCKER_BRIDGE_IP}
          #                      rather than 127.0.0.1 (which is unreachable inside containers).
          #                      The wait-for-deps busybox prestart tasks use this DNS name to
          #                      reach the Consul health API.
          consul agent -dev -bind=127.0.0.1 -client=0.0.0.0 \
            -advertise="${DOCKER_BRIDGE_IP}" \
            -recursor=8.8.8.8 -log-level=WARN &
          for i in $(seq 1 30); do
            if consul members >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          consul members >/dev/null 2>&1

          # Start Nomad with Consul integration so service registrations and
          # wait-for-deps prestart tasks (which poll Consul health API) are exercised.
          # Always use the Unix socket so the Docker driver can connect regardless of
          # how the runner's Docker context is configured (TCP vs socket).
          sudo env PATH="$PATH" DOCKER_HOST="unix:///var/run/docker.sock" \
            nomad agent -dev -bind=127.0.0.1 -log-level=WARN \
            -consul-address=127.0.0.1:8500 &
          for i in $(seq 1 45); do
            if NOMAD_ADDR=http://127.0.0.1:4646 nomad status >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          NOMAD_ADDR=http://127.0.0.1:4646 nomad status >/dev/null 2>&1

          # Wait for the Nomad Docker driver to be fingerprinted before returning.
          # Submitting jobs before fingerprinting completes leaves them un-schedulable.
          # Use the node-detail API endpoint (not the list view) since only the detail
          # view includes per-driver "Detected: true" status.
          echo "Waiting for Nomad Docker driver fingerprint..."
          for i in $(seq 1 60); do
            NODE_ID=$(NOMAD_ADDR=http://127.0.0.1:4646 nomad node status 2>/dev/null \
              | awk 'NR>1 && NF>0 {print $1; exit}')
            if [ -n "${NODE_ID}" ] && \
               NOMAD_ADDR=http://127.0.0.1:4646 nomad node status -verbose "${NODE_ID}" \
                 2>/dev/null | grep -q "docker.*true"; then
              echo "Nomad Docker driver fingerprinted successfully"
              break
            fi
            if [ "${i}" -eq 60 ]; then
              echo "WARNING: Docker driver not fingerprinted after 120s; dumping node status"
              NOMAD_ADDR=http://127.0.0.1:4646 nomad node status -verbose "${NODE_ID}" || true
            fi
            sleep 2
          done

      - name: Deploy with lightweight e2e stubs
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          E2E_JOB_PREFIX=$(awk -F'"' '/^[[:space:]]*job_name[[:space:]]*=[[:space:]]*"/{print $2; exit}' "${E2E_VAR_FILE}")
          if [ -z "${E2E_JOB_PREFIX}" ]; then
            echo "ERROR: unable to derive job_name from ${E2E_VAR_FILE}"
            exit 1
          fi
          echo "E2E_JOB_PREFIX=${E2E_JOB_PREFIX}" >> "${GITHUB_ENV}"
          echo "E2E_WEB_JOB=${E2E_JOB_PREFIX}-web" >> "${GITHUB_ENV}"
          echo "E2E_DB_JOB=${E2E_JOB_PREFIX}-db" >> "${GITHUB_ENV}"
          echo "E2E_REDIS_JOB=${E2E_JOB_PREFIX}-redis" >> "${GITHUB_ENV}"
          nomad-pack run --detach . --var-file "${E2E_VAR_FILE}"

      - name: Wait for Nomad web allocations
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          TIMEOUT=120
          DEADLINE=$(( $(date +%s) + TIMEOUT ))
          echo "Waiting for ${E2E_WEB_JOB} allocations to reach running state (timeout ${TIMEOUT}s)..."
          until nomad job allocs "${E2E_WEB_JOB}" 2>/dev/null | grep -q "running"; do
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "ERROR: timed out waiting for ${E2E_WEB_JOB} allocations after ${TIMEOUT}s"
              exit 1
            fi
            sleep 5
          done
          echo "${E2E_WEB_JOB} has running allocations"

      - name: Dump Nomad and Docker diagnostics
        if: always()
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        continue-on-error: true
        run: |
          NODE_ID=$(nomad node status 2>/dev/null | awk 'NR>1 && NF>0 {print $1; exit}')
          echo "=== Nomad Node Status (drivers) ==="
          [ -n "${NODE_ID}" ] && nomad node status -verbose "${NODE_ID}" || nomad node status || true
          echo "=== Nomad Job Status ==="
          nomad status || true
          echo "=== DB Job Allocations ==="
          nomad job allocs "${E2E_DB_JOB}" 2>/dev/null || true
          DB_ALLOC=$(nomad job allocs -json "${E2E_DB_JOB}" 2>/dev/null \
            | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['ID'] for x in a if x.get('ClientStatus')=='failed'), ''))" 2>/dev/null || echo "")
          [ -n "${DB_ALLOC}" ] && { echo "=== DB Alloc Status ==="; nomad alloc status -verbose "${DB_ALLOC}" || true; }
          echo "=== Redis Job Allocations ==="
          nomad job allocs "${E2E_REDIS_JOB}" 2>/dev/null || true
          REDIS_ALLOC=$(nomad job allocs -json "${E2E_REDIS_JOB}" 2>/dev/null \
            | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['ID'] for x in a if x.get('ClientStatus')=='failed'), ''))" 2>/dev/null || echo "")
          [ -n "${REDIS_ALLOC}" ] && { echo "=== Redis Alloc Status ==="; nomad alloc status -verbose "${REDIS_ALLOC}" || true; }
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Consul catalog services ==="
          consul catalog services || true
          echo "=== Consul health checks ==="
          consul watch -type=checks || true &
          sleep 2 && kill $! 2>/dev/null || true

      - name: Validate Consul service registrations (PRD AC-5)
        env:
          CONSUL_APP_SERVICE_TIMEOUT_SECONDS: "180"
          CONSUL_APP_SERVICE_RETRY_INTERVAL_SECONDS: "5"
        run: |
          # PRD Acceptance Criterion 5: All components resolve service connections
          # natively via Consul DNS names (e.g. db.service.consul).
          #
          # HARD assertion: Consul-Nomad integration is functional.
          # The `nomad` and `nomad-client` services appear in the Consul catalog
          # only when Nomad successfully registers with Consul — proving that the
          # -consul-address flag is effective and the service-registration path works.
          echo "=== Consul catalog services ==="
          consul catalog services
          echo ""
          echo "Verifying Consul-Nomad integration (nomad + nomad-client must be present)..."
          if ! consul catalog services | grep -qx "nomad"; then
            echo "FAIL: 'nomad' is NOT in the Consul catalog — consul-address integration broken"
            exit 1
          fi
          if ! consul catalog services | grep -qx "nomad-client"; then
            echo "FAIL: 'nomad-client' is NOT in the Consul catalog — consul-address integration broken"
            exit 1
          fi
          echo "PASS: Consul-Nomad integration verified (nomad + nomad-client registered)"
          echo ""

          # HARD assertion in e2e stub-image mode: openstudio-* registrations must appear.
          # This e2e job deploys examples/e2e-test.hcl, which uses lightweight stub images
          # specifically so service-registration checks are deterministic and CI-gating.
          # Full-image behavior is still covered by longer-running cluster-level suites.
          timeout_seconds="${CONSUL_APP_SERVICE_TIMEOUT_SECONDS}"
          retry_interval_seconds="${CONSUL_APP_SERVICE_RETRY_INTERVAL_SECONDS}"
          if [ "${timeout_seconds}" -le 0 ] || [ "${retry_interval_seconds}" -le 0 ]; then
            echo "FAIL: timeout/interval must be positive values"
            exit 1
          fi
          max_attempts=$(( (timeout_seconds + retry_interval_seconds - 1) / retry_interval_seconds ))

          echo "Checking required openstudio services (timeout=${timeout_seconds}s, retry=${retry_interval_seconds}s, attempts=${max_attempts})..."
          required_openstudio_services=(openstudio-db openstudio-redis openstudio-web openstudio-rserve)
          for attempt in $(seq 1 "${max_attempts}"); do
            consul_services="$(consul catalog services)"
            missing_services=()
            for svc in "${required_openstudio_services[@]}"; do
              if ! printf '%s\n' "${consul_services}" | grep -qx "${svc}"; then
                missing_services+=("${svc}")
              fi
            done

            if [ "${#missing_services[@]}" -eq 0 ]; then
              echo "PASS: All required openstudio services are registered in Consul"
              echo "Consul service-registration validation complete."
              exit 0
            fi

            echo "Attempt ${attempt}/${max_attempts}: waiting for services: ${missing_services[*]}"
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "FAIL: Required openstudio services were not all registered before timeout"
              echo "Missing services: ${missing_services[*]}"
              exit 1
            fi
            sleep "${retry_interval_seconds}"
          done

      - name: Dispatch smoke-test batch job
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          nomad job run examples/test-batch.nomad

          # Poll the HTTP API for job status — more reliable than parsing CLI JSON output
          # across Nomad versions (CLI -json structure changed in v2.x).
          python3 - <<'PY'
          import json, sys, time, urllib.request

          job_id = "openstudio-server-smoke-test"
          base   = "http://127.0.0.1:4646/v1/job"
          deadline = time.time() + 60

          while time.time() < deadline:
              with urllib.request.urlopen(f"{base}/{job_id}") as r:
                  status = json.load(r).get("Status")
              if status == "dead":
                  break
              time.sleep(2)
          else:
              print(f"ERROR: timeout waiting for {job_id}", file=sys.stderr)
              sys.exit(1)

          with urllib.request.urlopen(f"{base}/{job_id}/allocations") as r:
              allocs = json.load(r)
          if not allocs:
              print(f"ERROR: no allocations for {job_id}", file=sys.stderr)
              sys.exit(1)

          failed = [a for a in allocs if a.get("ClientStatus") != "complete"]
          if failed:
              for a in failed:
                  print(f"FAIL {a.get('ID','')} status={a.get('ClientStatus')}", file=sys.stderr)
              sys.exit(1)

          print("Smoke-test batch job completed successfully.")
          PY

      - name: Destroy e2e deployment
        if: always()
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: nomad-pack destroy . --var-file "${E2E_VAR_FILE}" || true
