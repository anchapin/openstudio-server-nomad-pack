name: Nomad Pack Validation

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@main

      - name: Run version bump script tests
        run: |
          ./scripts/test_bump_metadata_version.sh

      - name: Validate Pack
        run: |
          nomad-pack render .
