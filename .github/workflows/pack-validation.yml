name: Nomad Pack Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@v0.2.0

      - name: Validate Pack
        run: |
          nomad-pack validate .
