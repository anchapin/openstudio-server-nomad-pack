name: Nomad Pack Validation

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@ceba9087d4322dbdd7b35dafac5a87a8c459a157  # v1.0.0

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@36154659711632399739eb3b34d2e71dd54ed473  # 0.10.0

      - name: Check pack formatting
        run: nomad-pack fmt -check -recursive .

      - name: Validate pack rendering
        run: nomad-pack render .

      - name: Validate batch verification rendering
        run: nomad-pack render --var "enable_batch_verification=true" .

      - name: Validate Vagrantfile Syntax
        run: ruby -c Vagrantfile

      - name: Validate Provisioning Scripts
        run: |
          for script in vagrant/provision/*.sh; do
            bash -n "${script}"
          done

      - name: Run version bump script tests
        run: |
          ./scripts/test_bump_metadata_version.sh

      - name: Check variables.md is up-to-date
        run: |
          GENERATED_DOC=docs/variables.generated.md
          ./scripts/generate-vars-doc.sh "${GENERATED_DOC}"
          if ! diff -u docs/variables.md "${GENERATED_DOC}"; then
            echo "docs/variables.md is out of date. Run ./scripts/generate-vars-doc.sh and commit the result."
            rm -f "${GENERATED_DOC}"
            exit 1
          fi
          rm -f "${GENERATED_DOC}"

      - name: Check README references docs/variables.md (no stale inline table)
        run: |
          if [ ! -f docs/variables.md ]; then
            echo "ERROR: docs/variables.md does not exist."
            exit 1
          fi
          if ! grep -qF 'docs/variables.md' README.md; then
            echo "ERROR: README.md does not reference docs/variables.md."
            echo "The variable reference must link to docs/variables.md — do not maintain a duplicate table in the README."
            exit 1
          fi
          echo "OK: README.md references docs/variables.md and the file exists."

      - name: Check compatibility.md is up-to-date
        run: |
          PACK_VERSION=$(grep -E '^\s*version\s*=' metadata.hcl | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "${PACK_VERSION}" ]; then
            echo "ERROR: Could not extract pack version from metadata.hcl"
            exit 1
          fi

          REQUIRED_VERSION="${PACK_VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${GITHUB_BASE_REF}" = "main" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${PACK_VERSION}"
            REQUIRED_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "PR targets main: expecting upcoming release version ${REQUIRED_VERSION} in docs/compatibility.md"
          fi

          if ! grep -qF "\`${REQUIRED_VERSION}\`" docs/compatibility.md; then
            echo "ERROR: Required pack version ${REQUIRED_VERSION} is not present in docs/compatibility.md."
            echo "Add a row for the required release version before merging."
            exit 1
          fi
          echo "OK: Required pack version ${REQUIRED_VERSION} found in docs/compatibility.md."

      - name: Check docker_user non-root hardening is applied to all main service tasks
        run: |
          FAIL=0
          # All main service tasks must include a docker_user variable at the task level.
          # Service-specific overrides (e.g. db_docker_user, redis_docker_user) are accepted.
          # Lifecycle tasks (wait-for-deps, vector, cleanup-poststop) are intentionally excluded.
          for tpl in templates/web.nomad.tpl templates/worker.nomad.tpl templates/db.nomad.tpl templates/redis.nomad.tpl templates/rserve.nomad.tpl; do
            if ! grep -qE 'var "(db_|redis_)?docker_user"' "${tpl}"; then
              echo "ERROR: ${tpl} is missing docker_user non-root hardening"
              FAIL=1
            else
              echo "OK: ${tpl} contains docker_user"
            fi
          done
          if [ "${FAIL}" -ne 0 ]; then
            echo ""
            echo "Add 'user = \"[[ var \"docker_user\" . ]]\"' at the task level (not inside the config block) for each main service task."
            exit 1
          fi

      - name: Start Nomad dev agent
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          nomad agent -dev -bind=127.0.0.1 -log-level=ERROR &
          for i in {1..30}; do
            if nomad status >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Nomad dev agent did not become ready in time."
          exit 1

      - name: Plan dry-run
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan . --name openstudio-server
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan minimal-dev example
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --var-file examples/minimal-dev.hcl . --name openstudio-server-minimal-dev
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan production-ha example
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan \
            --var-file examples/production-ha.hcl \
            --var "region=global" \
            --var "vault_enabled=false" \
            --var "vault_integration_enabled=false" \
            --var "enable_consul_connect=false" \
            --var "worker_update_progress_deadline=2h" \
            . --name openstudio-server-production-ha
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan airgapped example
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --var-file examples/airgapped.hcl . --name openstudio-server-airgapped
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan with batch verification enabled
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --var "enable_batch_verification=true" . --name openstudio-server-batch-verification
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Validate test-batch job spec
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: nomad job validate examples/test-batch.nomad

      - name: Check packs/ registry scaffold is in sync with root
        run: |
          FAIL=0

          # 1. Pack version must match
          ROOT_VER=$(grep -E '^\s*version\s*=' metadata.hcl | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          PACK_VER=$(grep -E '^\s*version\s*=' packs/openstudio-server/metadata.hcl | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "${ROOT_VER}" != "${PACK_VER}" ]; then
            echo "ERROR: metadata version mismatch: root=${ROOT_VER} packs/=${PACK_VER}"
            FAIL=1
          else
            echo "OK: metadata version matches (${ROOT_VER})"
          fi

          # 2. variables.hcl must be byte-for-byte identical
          if ! diff -q variables.hcl packs/openstudio-server/variables.hcl > /dev/null 2>&1; then
            echo "ERROR: variables.hcl differs between root and packs/openstudio-server/"
            diff -u variables.hcl packs/openstudio-server/variables.hcl || true
            FAIL=1
          else
            echo "OK: variables.hcl matches exactly"
          fi

          # 3. outputs.tpl must be byte-for-byte identical
          if ! diff -q outputs.tpl packs/openstudio-server/outputs.tpl > /dev/null 2>&1; then
            echo "ERROR: outputs.tpl differs between root and packs/openstudio-server/"
            diff -u outputs.tpl packs/openstudio-server/outputs.tpl || true
            FAIL=1
          else
            echo "OK: outputs.tpl matches exactly"
          fi

          # 4. Template files must be identical
          for tpl in templates/*.tpl templates/*.nomad.tpl; do
            [ -f "${tpl}" ] || continue
            fname=$(basename "${tpl}")
            pack_tpl="packs/openstudio-server/templates/${fname}"
            if [ ! -f "${pack_tpl}" ]; then
              echo "ERROR: ${pack_tpl} is missing (present in root templates/)"
              FAIL=1
            elif ! diff -q "${tpl}" "${pack_tpl}" > /dev/null 2>&1; then
              echo "ERROR: ${tpl} and ${pack_tpl} differ"
              FAIL=1
            else
              echo "OK: ${fname} matches"
            fi
          done

          if [ "${FAIL}" -ne 0 ]; then
            echo ""
            echo "packs/openstudio-server/ is out of sync with root."
            echo "Run: cp variables.hcl packs/openstudio-server/variables.hcl"
            echo "     cp metadata.hcl packs/openstudio-server/metadata.hcl"
            echo "     cp outputs.tpl packs/openstudio-server/outputs.tpl"
            echo "     cp templates/*.tpl templates/*.nomad.tpl packs/openstudio-server/templates/"
            exit 1
          fi
          echo "All packs/ drift checks passed."

      - name: Run integration validation
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          ./scripts/test_nomad_pack_integration.sh
