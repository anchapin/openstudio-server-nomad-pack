name: Nomad Pack Validation

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@ceba9087d4322dbdd7b35dafac5a87a8c459a157  # v1.0.0

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@36154659711632399739eb3b34d2e71dd54ed473  # 0.10.0
        with:
          # Pin the CLI version: the action's `version` input defaults to
          # "latest" (a moving target). The fmt gate behavior (including the
          # `[[/* */]]` comment handling) was validated against v0.4.2.
          version: 0.4.2

      - name: Print Nomad Pack version
        run: nomad-pack version

      - name: Check pack formatting
        # Scoped to packs/openstudio-server/templates/ (nomad-pack v0.4.2 recursive discovery from the
        # pack root does not descend into templates/, making `-recursive .` a
        # silent no-op that always exits 0).
        run: nomad-pack fmt --check packs/openstudio-server/templates/

      - name: Validate pack rendering (render-after-fmt guard)
        # Renders immediately after the fmt gate to catch lexer regressions in
        # the formatter (v0.4.2 `fmt -write` once rewrote `[[- /*` comment
        # markers into a state the renderer rejects with "illegal number
        # syntax"). Render is fast; keep it cheap.
        run: nomad-pack render packs/openstudio-server

      - name: Warn on Nomad heredoc shell parameter expansions
        run: ./scripts/check-nomad-heredoc-interpolation.sh

  render-matrix:
    name: Render Matrix (${{ matrix.scenario.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: default
            args: "packs/openstudio-server"
          - name: minimal-dev
            args: "-var-file examples/quickstart/minimal-dev.hcl packs/openstudio-server"
          - name: simple
            args: "-var-file examples/quickstart/simple.hcl packs/openstudio-server"
          - name: production-ha
            args: "-var-file examples/advanced/production-ha.hcl packs/openstudio-server"
          - name: airgapped
            args: "-var-file examples/advanced/airgapped.hcl packs/openstudio-server"
          - name: openstack-production
            args: "-var-file examples/advanced/openstack-production.hcl packs/openstudio-server"
          - name: e2e-test
            args: "-var-file examples/advanced/e2e-test.hcl packs/openstudio-server"
          - name: batch-verification
            args: "-var enable_batch_verification=true packs/openstudio-server"
          - name: queue-sweeper
            args: "-var enable_queue_sweeper=true packs/openstudio-server"
          - name: nomad-batch-engine
            args: "-var batch_engine=nomad_batch -var nomad_batch_datacenter=dc1 -var nomad_batch_namespace=default -var nomad_batch_job_name=openstudio-simulation packs/openstudio-server"
          - name: aws-batch-engine
            args: "-var batch_engine=aws_batch -var aws_region=us-east-1 -var aws_batch_job_queue=openstudio-queue -var aws_batch_job_definition=openstudio-worker packs/openstudio-server"
          - name: vector-disabled
            args: "-var enable_vector_collection=false packs/openstudio-server"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@ceba9087d4322dbdd7b35dafac5a87a8c459a157  # v1.0.0

      - name: Setup Nomad Pack
        uses: hashicorp/setup-nomad-pack@36154659711632399739eb3b34d2e71dd54ed473  # 0.10.0
        with:
          version: 0.4.2

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Render Nomad Pack matrix scenario
        run: nomad-pack render ${{ matrix.scenario.args }}

      - name: Lint rendered POSIX shell snippets
        run: ./scripts/lint-posix-shell.sh ${{ matrix.scenario.args }}

      - name: Validate batch verification rendering
        run: nomad-pack render --var "enable_batch_verification=true" packs/openstudio-server

      - name: Validate Vagrantfile Syntax
        run: ruby -c Vagrantfile

      - name: Validate Provisioning Scripts
        run: |
          for script in vagrant/provision/*.sh; do
            bash -n "${script}"
          done

      - name: Run version bump script tests
        run: |
          ./scripts/test_bump_metadata_version.sh
          ./scripts/test_release_version_bump_workflow.sh

      - name: Run pre-teardown script tests
        run: |
          ./scripts/test_pre_teardown.sh
          ./scripts/test_validate_traefik_consul_endpoint.sh

      - name: Check migration docs variable mapping
        run: |
          ./scripts/test_migration_doc_variable_mapping.sh

      - name: Check OpenStack autoscaler render invariants
        run: |
          ./scripts/test_openstack_autoscaler_render.sh

      - name: Check service discovery guardrails
        run: |
          ./scripts/test_service_discovery_guardrails.sh

      - name: Check variables.md is up-to-date
        run: |
          GENERATED_DOC=docs/variables.generated.md
          ./scripts/generate-vars-doc.sh "${GENERATED_DOC}"
          if ! diff -u docs/variables.md "${GENERATED_DOC}"; then
            echo "docs/variables.md is out of date. Run ./scripts/generate-vars-doc.sh and commit the result."
            rm -f "${GENERATED_DOC}"
            exit 1
          fi
          rm -f "${GENERATED_DOC}"

      - name: Check backup/restore defaults in docs
        run: ./scripts/test_backup_restore_docs_defaults.sh

      - name: Check README references docs/variables.md (no stale inline table)
        run: |
          if [ ! -f docs/variables.md ]; then
            echo "ERROR: docs/variables.md does not exist."
            exit 1
          fi
          if ! grep -qF 'docs/variables.md' README.md; then
            echo "ERROR: README.md does not reference docs/variables.md."
            echo "The variable reference must link to docs/variables.md — do not maintain a duplicate table in the README."
            exit 1
          fi
          echo "OK: README.md references docs/variables.md and the file exists."

      - name: Check compatibility.md is up-to-date
        run: |
          PACK_VERSION=$(grep -E '^\s*version\s*=' packs/openstudio-server/metadata.hcl | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "${PACK_VERSION}" ]; then
            echo "ERROR: Could not extract pack version from packs/openstudio-server/metadata.hcl"
            exit 1
          fi

          REQUIRED_VERSION="${PACK_VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${GITHUB_BASE_REF}" = "main" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${PACK_VERSION}"
            REQUIRED_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "PR targets main: expecting upcoming release version ${REQUIRED_VERSION} in docs/compatibility.md"
          fi

          if ! grep -qF "\`${REQUIRED_VERSION}\`" docs/compatibility.md; then
            echo "ERROR: Required pack version ${REQUIRED_VERSION} is not present in docs/compatibility.md."
            echo "Add a row for the required release version before merging."
            exit 1
          fi
          echo "OK: Required pack version ${REQUIRED_VERSION} found in docs/compatibility.md."

      - name: Check docker_user non-root hardening is applied to all main service tasks
        run: |
          FAIL=0
          # All main service tasks must include a docker_user variable at the task level.
          # Service-specific overrides (e.g. db_docker_user, redis_docker_user) are accepted.
          # Lifecycle tasks (wait-for-deps, vector, cleanup-poststop) are intentionally excluded.
          # worker.nomad.tpl is an architecture marker file (worker consolidated into web.nomad.tpl,
          # fix #405); the worker task group is covered by the web.nomad.tpl entry below.
          for tpl in packs/openstudio-server/templates/web.nomad.tpl packs/openstudio-server/templates/db.nomad.tpl packs/openstudio-server/templates/redis.nomad.tpl packs/openstudio-server/templates/rserve.nomad.tpl; do
            if ! grep -qE 'var "(db_|redis_)?docker_user"' "${tpl}"; then
              echo "ERROR: ${tpl} is missing docker_user non-root hardening"
              FAIL=1
            else
              echo "OK: ${tpl} contains docker_user"
            fi
          done
          if [ "${FAIL}" -ne 0 ]; then
            echo ""
            echo "Add 'user = \"[[ var \"docker_user\" . ]]\"' (or the service-specific variant: db_docker_user / redis_docker_user) at the task level (not inside the config block) for each main service task."
            exit 1
          fi

      - name: Start Nomad dev agent
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          nomad agent -dev -bind=127.0.0.1 -log-level=ERROR &
          for i in {1..30}; do
            if nomad status >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Nomad dev agent did not become ready in time."
          exit 1

      - name: Plan dry-run
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --name openstudio-server packs/openstudio-server
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan minimal-dev example
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --var-file examples/quickstart/minimal-dev.hcl --name openstudio-server-minimal-dev packs/openstudio-server
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan production-ha example
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan \
            --var-file examples/advanced/production-ha.hcl \
            --var "region=global" \
            --var "vault_enabled=false" \
            --var "vault_integration_enabled=false" \
            --var "enable_consul_connect=false" \
            --var "worker_update_progress_deadline=2h" \
            --name openstudio-server-production-ha \
            packs/openstudio-server
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan airgapped example
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --var-file examples/advanced/airgapped.hcl --name openstudio-server-airgapped packs/openstudio-server
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Plan with batch verification enabled
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set +e
          nomad-pack plan --var "enable_batch_verification=true" --name openstudio-server-batch-verification packs/openstudio-server
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"

      - name: Validate test-batch job spec
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: nomad job validate examples/advanced/test-batch.nomad

      - name: Run integration validation
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          ./scripts/test_nomad_pack_integration.sh
