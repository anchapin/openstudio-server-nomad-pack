# Docker Compose for Nomad + Consul dev infrastructure
#
# Why this exists:
#   The Nomad Pack deploys OpenStudio Server tasks to Nomad, which uses
#   Consul for service discovery.  Running both in Docker eliminates the
#   need to install Nomad and Consul natively — only Docker + nomad-pack
#   are required.
#
# Networking:
#   Both containers use host networking so that:
#   1. Consul is at 127.0.0.1:8500 (HTTP) and 127.0.0.1:8600 (DNS) —
#      the wait-for-deps prestart tasks and Consul health checks all use
#      host networking and resolve services via 127.0.0.1.
#   2. Nomad's Docker driver launches sibling containers on the host
#      Docker daemon (via /var/run/docker.sock).
#   3. nomad CLI / nomad-pack on the host reach the API at 127.0.0.1:4646.
#
# macOS note:
#   Docker Desktop host networking requires "Enable host networking" to be
#   turned on in Docker Desktop → Settings → Features in Development, AND
#   Consul's TCP health checks cannot reach the Mac's loopback from inside
#   the Docker VM regardless.
#
#   On macOS, the Makefile bypasses this file for Consul and Nomad:
#   - Consul is run natively via `consul agent -dev` (brew install consul).
#   - Nomad is run natively (brew install hashicorp/tap/nomad).
#   This file is used on macOS ONLY if you uncomment and customise the
#   nomad service below for specific volume needs.
#
# Linux note:
#   host networking works natively on Linux — no extra Docker Desktop
#   configuration needed.
#
# Usage:
#   docker compose -f docker/docker-compose.yaml up -d
#   docker compose -f docker/docker-compose.yaml down -v
#
# Or use the Makefile (handles macOS vs Linux automatically):
#   make up
#   make down

services:
  consul:
    image: hashicorp/consul:1.17.2
    network_mode: host
    command:
      - agent
      - -dev
      - -client=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "consul members | grep -q alive"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nomad:
    image: hashicorp/nomad:1.7.6
    network_mode: host
    privileged: true
    depends_on:
      consul:
        condition: service_healthy
    command:
      - agent
      - -dev
      - -config=/etc/nomad/nomad.hcl
    volumes:
      # Docker socket — required for Nomad's Docker driver to launch task
      # containers as siblings on the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Nomad config — host volumes map to Docker named volumes below.
      - ./nomad.hcl:/etc/nomad/nomad.hcl:ro
      # Persistent storage for MongoDB and Redis data.
      - openstudio-mongodb:/opt/nomad/volumes/mongodb
      - openstudio-redis:/opt/nomad/volumes/redis
      # Nomad server state.
      - nomad-data:/opt/nomad/data
    environment:
      NOMAD_ADDR: http://127.0.0.1:4646
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4646/v1/agent/self | grep -q server"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  openstudio-mongodb:
    driver: local
  openstudio-redis:
    driver: local
  nomad-data:
    driver: local
